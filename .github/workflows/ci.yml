# CP3 — CI gate (docs/workflow/governed-sdlc.md in smart-hospital-architecture).
# Lint, tests (SQLite and PostgreSQL), Alembic round trip and a full-history secret scan on a clean machine.
# Uses synthetic, CI-only values; no real secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, tests, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Separate databases: the Alembic round trip leaves `alembic_version` behind, and the test suite
      # expects a disposable database of its own (it drops and recreates tables, and may run migrations).
      PG_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci
      PG_TEST_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests (SQLite)
        run: pytest

      - name: Alembic round trip (upgrade, downgrade, upgrade, check)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Create test database
        run: >-
          python -c "import psycopg;
          c = psycopg.connect('postgresql://ci:ci-only-password@localhost:5432/ci', autocommit=True);
          c.execute('CREATE DATABASE ci_test'); c.close()"

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: ${{ env.PG_TEST_URL }}
        run: pytest

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI image (the gitleaks-action needs a paid licence for organization repositories).
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose
