# Delivery: build this service's image, push it to ECR, then record the new tag in
# smart-hospital-gitops deploy/helm/<service>/dev-values.yaml. Argo CD sees that commit and rolls the service out.
# AWS access is through GitHub OIDC (smart-hospital-infra module github-oidc); no AWS keys are stored in GitHub.
# Requires the repository (or organization) secret GITOPS_PUSH_TOKEN: a fine-grained token owned by
# UST-HealthCare-Project with Contents read/write on smart-hospital-gitops only.
name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Override with the variable AWS_ROLE_ARN (terraform output github_actions_role_arn).
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::165742853391:role/smart-hospital-dev-github-actions' }}
  ECR_NAMESPACE: smart-hospital
  SERVICE: ${{ github.event.repository.name }}
  GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY || 'UST-HealthCare-Project/smart-hospital-gitops' }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ env.ECR_NAMESPACE }}/${{ env.SERVICE }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "$REPO:$TAG already exists (tags are immutable); skipping build"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ env.SERVICE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Update dev-values.yaml in GitOps repo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check GitOps token
        env:
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
        run: |
          [ -n "$GITOPS_PUSH_TOKEN" ] || { echo "::error::secret GITOPS_PUSH_TOKEN is not set; the image was pushed but not deployed"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}

      - name: Set image tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          f="deploy/helm/$SERVICE/dev-values.yaml"
          [ -f "$f" ] || { echo "::error::$f not found in $GITOPS_REPOSITORY"; exit 1; }
          yq -i ".image.tag = \"$TAG\"" "$f"
          git diff --stat

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git diff --quiet && { echo "Nothing to change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): roll out $SERVICE $TAG" -m "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          for _ in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
